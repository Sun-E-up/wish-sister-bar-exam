<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>祝姐姐法考顺利，一战上岸！</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei",sans-serif;
        }
        body{
            min-height:100vh;
            background: linear-gradient(135deg,#2c3e50,#3498db);
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            color:#fff;
            text-align:center;
            padding:20px;
        }
        .card{
            background:rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            padding:50px 40px;
            border-radius:20px;
            border:1px solid rgba(255,255,255,0.25);
            max-width:600px;
        }
        h1{
            font-size:2.4rem;
            margin-bottom:24px;
        }
        .text{
            font-size:1.2rem;
            line-height:2;
            margin-bottom:30px;
        }
        .bless{
            font-size:1.4rem;
            font-weight:bold;
            color:#ffd700;
        }
        @keyframes float{
            0%{transform: translateY(0px);}
            50%{transform: translateY(-12px);}
            100%{transform: translateY(0px);}
        }
        .float-box{
            animation: float 3s ease-in-out infinite;
        }
        footer{
            margin-top:30px;
            font-size:0.95rem;
            opacity:0.8;
        }
    </style>
</head>
<body>
    <div class="card float-box">
        <h1>致姐姐✨</h1>
        <div class="text">
            伏案苦读，日夜耕耘<br>
            法条万卷，烂熟于心<br>
            笔锋所至，法理分明
        </div>
        <div class="bless">
            愿法考旗开得胜，顺利通关！<br>
            得偿所愿，成功拿证！
        </div>
    </div>
    <footer>来自弟弟/妹妹的祝福</footer>
</body>
</html>
